<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro de rota de coleta — AgroLog</title>
  <meta name="description" content="Formulário acessível para cadastrar rotas de coleta da AgroLog." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo">
    <h1>Cadastro de rota de coleta</h1>
  </header>

  <main class="container">

    <!-- Região viva: o leitor de tela ANUNCIA o texto que o JavaScript escrever aqui.
         Ela precisa existir no HTML ANTES da mudança. -->
    <!-- ✔ Passo: criar o resumo de erros e o aviso de sucesso: <p id="resumo" role="alert" hidden></p> e <p id="sucesso" role="status" hidden></p> -->
    <p id="resumo" class="status erro" role="alert" hidden></p>
    <p id="sucesso" class="status sucesso" role="status" hidden></p>

    <section class="cartao" aria-labelledby="t-form">
      <h2 id="t-form">Dados da rota</h2>

      <!-- novalidate: desligamos a validação padrão do navegador para mostrar NOSSAS mensagens acessíveis -->
      <form id="form-rota" novalidate>

        <div class="campo">
          <!-- ✔ Passo: ligar o rótulo ao campo com <label for="origem">Origem</label> -->
          <!-- for="origem" casa com id="origem": o leitor de tela anuncia "Origem, caixa de edição" -->
          <label for="origem">Origem</label>
          <input type="text" id="origem" name="origem" autocomplete="off" required />
          <p class="erro-campo" id="erro-origem" hidden></p>
        </div>

        <div class="campo">
          <label for="destino">Destino</label>
          <input type="text" id="destino" name="destino" autocomplete="off" required />
          <p class="erro-campo" id="erro-destino" hidden></p>
        </div>

        <div class="campo">
          <label for="data">Data da coleta</label>
          <input type="date" id="data" name="data" required />
          <p class="erro-campo" id="erro-data" hidden></p>
        </div>

        <div class="campo">
          <label for="carga">Tipo de carga</label>
          <select id="carga" name="carga" required>
            <option value="">Selecione…</option>
            <option value="graos">Grãos</option>
            <option value="hortifruti">Hortifrúti</option>
            <option value="insumos">Insumos agrícolas</option>
          </select>
          <p class="erro-campo" id="erro-carga" hidden></p>
        </div>

        <!-- ✔ Passo: agrupar os dois rádios em <fieldset> com <legend>Urgência</legend> -->
        <!-- fieldset + legend: o leitor anuncia "Urgência, grupo" antes de cada opção -->
        <fieldset>
          <legend>Urgência</legend>
          <label><input type="radio" name="urgencia" value="normal" checked /> Normal</label>
          <label><input type="radio" name="urgencia" value="urgente" /> Urgente</label>
        </fieldset>

        <div class="campo">
          <label for="obs">Observações</label>
          <!-- ✔ Passo: ligar a dica ao campo com aria-describedby="dica-obs" (e criar <p id="dica-obs">) -->
          <!-- aria-describedby: o leitor lê a dica DEPOIS do nome do campo -->
          <textarea id="obs" name="obs" rows="3" aria-describedby="dica-obs"></textarea>
          <p class="nota" id="dica-obs">Opcional. Ex.: "carga refrigerada" ou "portão lateral".</p>
        </div>

        <button type="submit" class="btn">Cadastrar rota</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
